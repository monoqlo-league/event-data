# CSVが更新されたら、ファイル一覧(index.json)を作り直し、CSVを点検する。
# - index.json はランキングページが最初に1回だけ読む一覧(ファイルごとの最終更新日時と対局数)。
#   これがあれば、ページは GitHub の API(1時間60回の制限)を使わずに済む。
# - 点検で問題が見つかったら Discord に知らせる(DISCORD_ADMIN_WEBHOOK_URL、無ければ DISCORD_WEBHOOK_URL)。
# 「Actions」タブから手動で実行すると、全部のCSVを点検して結果を送る(問題がなくても送る)。
name: データの一覧と点検

on:
  push:
    branches: [main]
    paths:
      - "**.csv"
  workflow_dispatch:

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 一覧を作って点検する
        env:
          DATA_KIND: team
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ADMIN_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: python3 .github/build-index.py
      - name: index.json を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then echo "変わったものはない"; exit 0; fi
          msg="index.json を更新(自動)"
          git commit -q -m "$msg"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: 分割CSV(splitdata-download)の作成を頼む
        # 対局記録がそろった開催日の分を、ダウンロードページに出してもらう。
        # 知らせるには、splitdata-download に書き込めるトークンを Secrets の SPLIT_DISPATCH_TOKEN に入れておく
        # (monoqlo-data と同じトークンでよい)。無いときは何もしない(splitdata-download は1日1回、自分でも確かめる)。
        # 手動実行のときも頼む。index.json の保存に失敗しても頼む(対局記録はもう置いてあるため)
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          TOKEN: ${{ secrets.SPLIT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SPLIT_DISPATCH_TOKEN が無いので知らせない(splitdata-download の1日1回の確認で分割される)"
            exit 0
          fi
          code=$(curl -sS -o /tmp/res -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/monoqlo-league/splitdata-download/dispatches \
            -d '{"event_type":"event-data-updated"}') || code=000
          if [ "$code" = "204" ]; then echo "知らせた"; exit 0; fi
          echo "::warning::知らせられなかった(HTTP $code: $(head -c 200 /tmp/res | tr '\n' ' '))。1日1回の確認で分割される"
